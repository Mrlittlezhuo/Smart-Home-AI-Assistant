services:
  postgres:
    image: postgres:16
    container_name: whole-home-postgres
    environment:
      POSTGRES_USER: whole_home
      POSTGRES_PASSWORD: whole_home
      POSTGRES_DB: whole_home
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whole_home"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
